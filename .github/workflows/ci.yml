name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly Monday — catches Playwright updates

jobs:
  resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install shells
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y fish zsh

      - name: Test package resolution and shell wrappers
        env:
          npm_config_offline: 'true'
        run: bash tests/test-resolution.sh

  test:
    needs: resolution
    strategy:
      matrix:
        fedora: [41, 42, 43, 44]
      fail-fast: false
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image (Fedora ${{ matrix.fedora }})
        run: |
          docker build \
            --build-arg FEDORA_VERSION=${{ matrix.fedora }} \
            -t playwright-fedora:${{ matrix.fedora }} \
            .

      - name: Run tests
        run: |
          docker run --rm \
            --shm-size=1g \
            playwright-fedora:${{ matrix.fedora }}
